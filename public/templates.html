<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1e22"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/site.css">
<title>Templates - AxR Battle Cards</title>
<meta name="description" content="Card layouts made by AxR players. Use one on your own Battle Card.">
<style>
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:8px}
.tpl{background:var(--panel,#26272c);border:3px solid #111;box-shadow:inset 3px 3px 0 rgba(255,255,255,.06),inset -3px -3px 0 rgba(0,0,0,.35);padding:10px;display:flex;flex-direction:column;gap:10px}
.tpl canvas{width:100%;height:auto;display:block;border:2px solid #111;background:#111}
.tpl h3{margin:0;font-size:17px}
.tpl .meta{color:var(--muted,#9aa0a6);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.tpl .row{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--muted,#9aa0a6)}
</style>
</head><body>
<div id="nav"></div>
<main class="wrap">
  <div class="page-head"><div class="crumb"><a href="/">HOME</a> / TEMPLATES</div><h1>Templates</h1><p>Card layouts made by players. Tap <b>Use this layout</b> to apply one to your own card. Only the layout is copied, so your colors, font and pictures stay.</p></div>
  <p><a class="btn primary" href="/editor">Make your own in the editor</a></p>
  <div class="tpls" id="list"><div class="empty">Loading templates...</div></div>
</main>
<footer class="foot" id="footer"></footer>
<script type="module">
import { mountChrome, fillNavUser, esc } from '/js/ui.js';
import { drawCard, cardSize, buildCardData, sanitizeConfig, DEFAULT_CONFIG } from '/js/card-core.js';
import { loadFonts, toast } from '/js/boot.js';
mountChrome();
const me = await fillNavUser();
await loadFonts();
const T = { SWORD: 'HT2', AXE: 'LT3', UHC: 'HT3', DPOT: 'LT2', NPOT: 'HT4', SMP: 'LT4', SMACE: 'HT1', EMACE: 'LT3', DSMP: 'HT3', CRYSTAL: 'LT2' };
const data = buildCardData({ name: 'Steve', handle: 'steve', avatarInitial: 'S', tiers: T });
const list = document.getElementById('list');
let items = [];
try { items = (await (await fetch('/api/templates')).json()).templates || []; } catch {}
if (!items.length) list.innerHTML = '<div class="empty">No templates yet. Be the first: open the editor, pick the Layout tab, customize it and publish it.</div>';
else {
  list.innerHTML = items.map((t) => `<div class="tpl" data-id="${esc(t.id)}"><canvas data-i="${esc(t.id)}"></canvas><h3>${esc(t.name)}</h3><div class="meta"><span>by ${esc(t.by.name)}</span><span>${t.uses} use${t.uses === 1 ? '' : 's'}</span></div><div class="row"><a class="btn primary sm" href="/editor?template=${esc(t.id)}">Use this layout</a><a class="btn sm" href="/designer?template=${esc(t.id)}">Remix</a><button class="btn sm ghost" data-report="${esc(t.id)}">Report</button>${me && me.user && me.user.id === t.by.id ? `<button class="btn sm ghost" data-del="${esc(t.id)}">Delete</button>` : ''}</div></div>`).join('');
  for (const t of items) {
    const cfg = sanitizeConfig({ ...DEFAULT_CONFIG, layout: 'custom', custom: t.custom, stats: { ...DEFAULT_CONFIG.stats, tagline: 'Ready to fight.' } });
    const cv = list.querySelector(`canvas[data-i="${t.id}"]`), s = cardSize(cfg);
    cv.width = s.width; cv.height = s.height; drawCard(cv.getContext('2d'), cfg, data, {});
  }
}
async function post(body) {
  const r = await fetch('/api/templates', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || 'failed'), { code: j.error }); return j;
}
list.addEventListener('click', async (e) => {
  const rp = e.target.closest('[data-report]'), dl = e.target.closest('[data-del]');
  if (rp) {
    if (!me) return (location.href = '/api/auth/login');
    if (!confirm('Report this template as inappropriate or broken?')) return;
    try { await post({ a: 'report', id: rp.dataset.report }); toast('Thanks, reported.'); } catch (err) { toast('Could not report: ' + err.message, true); }
  }
  if (dl) {
    if (!confirm('Delete your template?')) return;
    try { await post({ a: 'delete', id: dl.dataset.del }); dl.closest('.tpl').remove(); toast('Deleted.'); } catch (err) { toast('Could not delete: ' + err.message, true); }
  }
});
</script></body></html>
