<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1e22"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/site.css">
<title>Editor - AxR Battle Cards</title>
</head><body>
<div id="nav"></div>
<main class="wrap">
  <div id="banner"></div>
  <div class="loading" id="loading">Loading editor</div>

  <section class="locked" id="locked" hidden>
    <div class="blur"><canvas id="lockcv"></canvas><div class="lock">LOCKED</div></div>
    <h1 id="lockt">Rank required</h1>
    <p id="lockp"></p>
    <div class="actions"><a class="btn" href="/">Back home</a><button class="btn primary" id="recheck">I got ranked, check again</button></div>
  </section>

  <div class="app" id="app" hidden>
    <div class="stage-col">
      <div class="stage">
        <div class="canvas-wrap"><canvas id="cv"></canvas></div>
        <div class="bar">
          <span class="state"><i class="dot" id="dot"></i><span id="stat">Ready</span></span>
          <span class="tools">
            <button class="iconbtn" id="undo" title="Undo" disabled></button>
            <button class="iconbtn" id="redo" title="Redo" disabled></button>
            <button class="iconbtn" id="reset" title="Reset this card"></button>
          </span>
        </div>
        <div class="hotbar-wrap">
          <div class="hotbar" id="hotbar"></div>
          <div class="hb-info">
            <div class="hb-name" id="hbname"></div>
            <div class="hb-actions">
              <button class="iconbtn" id="rename" title="Rename this card"></button>
              <button class="iconbtn" id="dup" title="Copy to the next empty slot"></button>
              <button class="iconbtn" id="clear" title="Empty this slot"></button>
            </div>
          </div>
        </div>
        <div class="cta-row">
          <button class="btn primary" id="publish">Publish this card</button>
          <button class="btn" id="copy"></button>
          <button class="btn" id="dl"></button>
        </div>
        <div style="padding-top:8px" id="viewrow" hidden><a class="btn sm ghost" id="view" href="#" target="_blank" style="width:100%">Open my public profile</a></div>
      </div>
    </div>
    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div id="panes"></div>
    </div>
  </div>
</main>
<footer class="foot" id="footer"></footer>
<script type="module" src="/js/editor.js"></script>
</body></html>
