<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1e22"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/site.css">
<title>Gallery - AxR Battle Cards</title>
<meta name="description" content="Example Battle Cards you can use as a starting point.">
</head><body>
<div id="nav"></div>
<main class="wrap">
  <div class="page-head"><div class="crumb"><a href="/">HOME</a> / GALLERY</div><h1>Gallery</h1><p>Starting points for your own card. Pick one and it opens in the editor with that style applied. Every part can be changed afterwards.</p></div>
  <div class="gal-grid" id="grid"></div>
</main>
<footer class="foot" id="footer"></footer>
<script type="module">
import { mountChrome, fillNavUser } from '/js/ui.js';
import { drawCard, cardSize, buildCardData, sanitizeConfig, DEFAULT_CONFIG, THEMES, LAYOUTS, FONTS } from '/js/card-core.js';
import { loadFonts } from '/js/boot.js';
mountChrome(); fillNavUser();
const T = { SWORD: 'HT2', AXE: 'LT3', UHC: 'HT3', DPOT: 'LT2', NPOT: 'HT4', SMP: 'LT4', SMACE: 'HT1', EMACE: 'LT3', CART: 'HT3', CRYSTAL: 'LT2' };
const ex = [
  ['Neon Cyan', 'classic', 'orbitron', 'chips', 'neon'], ['Redstone', 'split', 'russo', 'blocks', 'solid'], ['Emerald', 'showcase', 'chakra', 'chips', 'neon'],
  ['Ender', 'classic', 'audiowide', 'list', 'double'], ['Gold Rush', 'compact', 'rajdhani', 'chips', 'neon'], ['Frostbite', 'split', 'orbitron', 'blocks', 'double'],
  ['Redstone', 'showcase', 'press', 'chips', 'corners'], ['Emerald', 'compact', 'mono', 'blocks', 'solid'], ['Ender', 'split', 'chakra', 'chips', 'dashed'],
];
const grid = document.getElementById('grid'); await loadFonts();
const data = buildCardData({ name: 'Steve', handle: 'steve', avatarInitial: 'S', tiers: T });
for (const [theme, layout, font, tiers, border] of ex) {
  const t = THEMES[theme];
  const cfg = sanitizeConfig({ ...DEFAULT_CONFIG, layout, font, colors: { ...DEFAULT_CONFIG.colors, ...t.colors }, bg: { ...DEFAULT_CONFIG.bg, ...t.bg }, tiers: { ...DEFAULT_CONFIG.tiers, style: tiers }, border: { ...DEFAULT_CONFIG.border, style: border } });
  const el = document.createElement('div'); el.className = 'gal-card';
  el.innerHTML = '<canvas></canvas><div class="row"><div><b>' + theme.toUpperCase() + '</b><br><span>' + LAYOUTS[layout].label + ' &middot; ' + FONTS[font].label + '</span></div><a class="btn sm primary" href="/editor?theme=' + encodeURIComponent(theme) + '&layout=' + layout + '&font=' + font + '&tiers=' + tiers + '&border=' + border + '">Use this</a></div>';
  grid.appendChild(el);
  const cv = el.querySelector('canvas'), s = cardSize(cfg); cv.width = s.width; cv.height = s.height; drawCard(cv.getContext('2d'), cfg, data, {});
}
</script></body></html>
