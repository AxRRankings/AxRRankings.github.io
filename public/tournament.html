<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1e22"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/site.css">
<title>Tournament - AxR Battle Cards</title>
<meta name="description" content="Live bracket for the current AxR tournament.">
</head><body>
<div id="nav"></div>
<main class="wrap">
  <div class="t-head"><div><h1 id="tt">Tournament</h1><p id="ts"></p></div><span class="t-state" id="tstate" hidden></span></div>
  <div id="body"><div class="loading">Loading</div></div>
  <div id="histwrap" class="section" hidden><div class="section-head"><h2>Past tournaments</h2></div><div class="hist" id="hist"></div></div>
</main>
<div id="modal" class="modal" hidden></div>
<footer class="foot" id="footer"></footer>
<script type="module">
import { mountChrome, fillNavUser, esc } from '/js/ui.js';
import { sfx } from '/js/sfx.js';
mountChrome(); fillNavUser();
const body = document.getElementById('body'), modal = document.getElementById('modal');
let last = '';
const av = (p) => p && p.avatarUrl ? '<img class="t-av" src="' + esc(p.avatarUrl) + '" alt="">' : '<span class="t-av">' + esc(((p && p.name) || '?')[0].toUpperCase()) + '</span>';

function render(t, hist) {
  const key = JSON.stringify([t, hist]); if (key === last) return; last = key;
  document.getElementById('histwrap').hidden = !(hist && hist.length);
  document.getElementById('hist').innerHTML = (hist || []).map((h) => '<div><b>' + esc(h.name) + '</b><span>' + (h.champion ? 'Champion: ' + esc(h.champion) : esc(h.status)) + ' &middot; ' + h.players + ' players</span></div>').join('');
  const st = document.getElementById('tstate');
  if (!t) {
    document.getElementById('tt').textContent = 'Tournament'; document.getElementById('ts').textContent = ''; st.hidden = true;
    body.innerHTML = '<div class="t-empty"><h2>No tournament right now</h2><p>When staff open one, sign-ups and the live bracket show up here. Watch the announcements channel.</p></div>'; return;
  }
  const P = Object.fromEntries(t.entrants.map((e) => [e.id, e]));
  document.getElementById('tt').textContent = t.name;
  document.getElementById('ts').textContent = (t.mode === 'ANY' ? 'Any mode' : t.mode) + ' · 1v1 knockout · ' + t.entrants.length + ' player' + (t.entrants.length === 1 ? '' : 's');
  st.hidden = false; st.className = 't-state ' + t.status; st.textContent = { open: 'SIGN-UPS OPEN', live: 'LIVE', done: 'FINISHED', cancelled: 'CANCELLED' }[t.status];
  let html = '';
  if (t.status === 'done' && P[t.champion]) html += '<div class="champ">' + av(P[t.champion]) + '<div><small>CHAMPION</small><b>' + esc(P[t.champion].name) + '</b></div></div>';
  if (t.status === 'open') {
    html += '<div class="callout" style="margin:0 0 18px"><div><h3>Join in Discord</h3><p>Type <code>1tjoin</code> in the server. Anyone in the server can play. The bracket is seeded by combat points when staff start it.</p></div></div>';
    html += t.entrants.length ? '<div class="pl-grid">' + t.entrants.map((e) => '<button class="pl" data-id="' + esc(e.id) + '">' + av(e) + '<div style="min-width:0"><div class="nm">' + esc(e.name) + '</div><div class="pt">' + e.points + ' pts</div></div></button>').join('') + '</div>' : '<div class="t-empty"><p>Nobody has joined yet. Be the first with <code>1tjoin</code>.</p></div>';
  } else if (t.status === 'cancelled') {
    html += '<div class="t-empty"><h2>This tournament was cancelled</h2></div>';
  } else {
    let curSet = false;
    html += '<div class="bracket-scroll"><div class="bracket">' + t.rounds.map((round, r) => {
      return '<div class="b-col"><h4>' + esc(t.roundNames[r].toUpperCase()) + '</h4><div class="b-list">' + round.map((m) => {
        const open = m.a && m.b && !m.w; const cur = open && !curSet && t.status === 'live'; if (cur) curSet = true;
        const row = (id, other) => {
          if (!id) return '<div class="b-p ' + (m.bye && other ? 'bye' : 'tbd') + '"><span class="sd"></span><span class="nm">' + (m.bye && other ? 'Bye' : 'TBD') + '</span></div>';
          const p = P[id] || { name: '?' };
          return '<button class="b-p ' + (m.w ? (m.w === id ? 'win' : 'lose') : '') + '" data-id="' + esc(id) + '"><span class="sd">' + (p.seed || '') + '</span>' + av(p) + '<span class="nm">' + esc(p.name) + '</span></button>';
        };
        return '<div class="b-m ' + (cur ? 'cur' : '') + (r === t.rounds.length - 1 ? ' last' : '') + '">' + row(m.a, m.b) + row(m.b, m.a) + '</div>';
      }).join('') + '</div></div>';
    }).join('') + '</div></div><p class="hint" style="margin-top:12px">Tap a player to see their Battle Card. The gold outline marks the next match.</p>';
  }
  const sc = body.querySelector('.bracket-scroll'), keep = sc ? sc.scrollLeft : 0;
  body.innerHTML = html;
  const sc2 = body.querySelector('.bracket-scroll'); if (sc2) sc2.scrollLeft = keep;
}

body.addEventListener('click', (e) => {
  const b = e.target.closest('[data-id]'); if (!b) return;
  const id = b.dataset.id, nm = (b.querySelector('.nm') || {}).textContent || 'Player';
  modal.innerHTML = '<div class="modal-box"><img id="mimg" src="/api/card/' + encodeURIComponent(id) + '.png?v=' + (Date.now() >> 16) + '" alt="Battle card of ' + esc(nm) + '"><div class="modal-bar"><div><h3>' + esc(nm) + '</h3><div class="sub" id="msub">Battle Card</div></div><div class="modal-act"><button class="btn sm primary" id="mx">Close</button></div></div></div>';
  document.getElementById('mimg').onerror = () => { document.getElementById('mimg').style.display = 'none'; document.getElementById('msub').textContent = 'This player has no ranked card yet.'; };
  modal.hidden = false; document.body.style.overflow = 'hidden'; sfx.pop();
});
const close = () => { modal.hidden = true; modal.innerHTML = ''; document.body.style.overflow = ''; };
modal.addEventListener('click', (e) => { if (e.target === modal || e.target.id === 'mx') close(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) close(); });

async function poll() {
  try { const j = await (await fetch('/api/tournament')).json(); render(j.t, j.history); }
  catch { if (!last) body.innerHTML = '<div class="t-empty"><p>Could not load the tournament. Retrying...</p></div>'; }
}
await poll(); setInterval(() => { if (!document.hidden) poll(); }, 12000);
</script>
</body></html>
